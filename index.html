<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>VERQDUS - Official</title>

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600;700;900&family=Oswald:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <style>

        /* =========================================
           VARIABLES
        ========================================= */

        :root {
            --black: #050505;
            --black-light: #0b0b0b;
            --card: #101010;

            --white: #ffffff;
            --white-soft: #d8d8d8;
            --gray: #777777;

            --gold: #d6b86a;
            --gold-light: #f0d99a;
            --gold-dark: #9b7c32;

            --border: rgba(255,255,255,0.12);
            --gold-border: rgba(214,184,106,0.65);

            --font-title: 'Cinzel', serif;
            --font-body: 'Oswald', sans-serif;
        }


        /* =========================================
           RESET
        ========================================= */

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
        }

        body {
            background: var(--black);
            color: var(--white);
            font-family: var(--font-body);
            overflow: hidden;
        }


        /* =========================================
           BACKGROUND
        ========================================= */

        body::before {
            content: "";

            position: fixed;
            inset: 0;

            background:
                radial-gradient(
                    circle at 50% 45%,
                    rgba(255,255,255,0.045),
                    transparent 35%
                ),
                radial-gradient(
                    circle at 50% 100%,
                    rgba(214,184,106,0.035),
                    transparent 35%
                );

            pointer-events: none;
        }


        /* Moving light */

        body::after {
            content: "";

            position: fixed;

            top: -20%;
            left: -30%;

            width: 35%;
            height: 140%;

            background: linear-gradient(
                90deg,
                transparent,
                rgba(255,255,255,0.025),
                transparent
            );

            transform: rotate(20deg);

            animation: lightMove 9s infinite ease-in-out;

            pointer-events: none;
        }


        @keyframes lightMove {

            0% {
                left: -40%;
                opacity: 0;
            }

            30% {
                opacity: 1;
            }

            70% {
                opacity: 1;
            }

            100% {
                left: 120%;
                opacity: 0;
            }

        }


        /* =========================================
           PAGE SYSTEM
        ========================================= */

        .section {

            position: absolute;

            inset: 0;

            width: 100%;
            height: 100vh;

            display: flex;

            justify-content: center;
            align-items: center;

            opacity: 0;

            visibility: hidden;

            transition:
                opacity 0.6s ease,
                visibility 0.6s ease;
        }


        .section.active {

            opacity: 1;

            visibility: visible;
        }


        .content-wrapper {

            width: 90%;

            max-width: 900px;

            text-align: center;
        }


        /* =========================================
           LANDING PAGE
        ========================================= */

        #landing-page {
            position: relative;
        }


        .landing-content {

            display: flex;

            flex-direction: column;

            align-items: center;

            justify-content: center;
        }


        /* Decorative top line */

        .top-line {

            width: 80px;

            height: 1px;

            background: linear-gradient(
                to right,
                transparent,
                var(--gold),
                transparent
            );

            margin-bottom: 35px;

            animation: lineGlow 3s infinite ease-in-out;
        }


        @keyframes lineGlow {

            0%,
            100% {
                opacity: 0.35;
            }

            50% {
                opacity: 1;
            }
        }


        /* =========================================
           MAIN TITLE
        ========================================= */

        .main-title {

            font-family: var(--font-title);

            font-size: clamp(
                2.5rem,
                6vw,
                5rem
            );

            font-weight: 600;

            letter-spacing: 14px;

            color: #ffffff;

            text-transform: uppercase;

            margin-left: 14px;

            position: relative;

            animation: titleAppear 1.2s ease forwards;

            text-shadow:
                0 0 10px rgba(255,255,255,0.08),
                0 0 30px rgba(214,184,106,0.08);

            overflow: hidden;
        }


        /* Title shimmer */

        .main-title::after {

            content: "";

            position: absolute;

            top: 0;
            left: -100%;

            width: 50%;
            height: 100%;

            background: linear-gradient(
                90deg,
                transparent,
                rgba(255,255,255,0.7),
                transparent
            );

            transform: skewX(-20deg);

            animation: titleShine 5s infinite;
        }


        @keyframes titleShine {

            0% {
                left: -100%;
            }

            20% {
                left: 130%;
            }

            100% {
                left: 130%;
            }
        }


        @keyframes titleAppear {

            from {

                opacity: 0;

                transform:
                    translateY(20px);
            }

            to {

                opacity: 1;

                transform:
                    translateY(0);
            }
        }


        /* =========================================
           OFFICIAL
        ========================================= */

        .luxury-line {

            display: flex;

            align-items: center;

            justify-content: center;

            gap: 15px;

            margin-top: 20px;

            color: #777;

            font-size: 0.7rem;

            letter-spacing: 5px;
        }


        .luxury-line::before,
        .luxury-line::after {

            content: "";

            width: 45px;

            height: 1px;

            background: #333;
        }


        /* =========================================
           MEMBERS BUTTON
        ========================================= */

        .premium-button {

            position: relative;

            margin-top: 55px;

            padding: 16px 55px;

            background: transparent;

            border: 1px solid var(--gold-border);

            color: var(--white);

            font-family: var(--font-body);

            font-size: 1rem;

            letter-spacing: 5px;

            cursor: pointer;

            overflow: hidden;

            transition:
                color 0.4s ease,
                background 0.4s ease,
                box-shadow 0.4s ease,
                border-color 0.4s ease;
        }


        .premium-button span {

            position: relative;

            z-index: 2;
        }


        .premium-button::before {

            content: "";

            position: absolute;

            inset: 0;

            background: var(--gold);

            transform: translateX(-105%);

            transition:
                transform 0.5s ease;
        }


        .premium-button:hover::before {

            transform: translateX(0);
        }


        .premium-button:hover {

            color: #050505;

            border-color: var(--gold);

            box-shadow:
                0 0 25px rgba(214,184,106,0.18);
        }


        /* =========================================
           MEMBERS PAGE
        ========================================= */

        #members-page {

            align-items: flex-start;

            justify-content: flex-start;

            overflow-y: auto;

            padding-top: 100px;

            padding-bottom: 60px;
        }


        #members-page .content-wrapper {

            margin: 0 auto;
        }


        /* =========================================
           BACK BUTTON
        ========================================= */

        .back-button {

            position: fixed;

            top: 25px;

            left: 25px;

            padding: 10px 20px;

            background: transparent;

            border: 1px solid #292929;

            color: #999;

            font-family: var(--font-body);

            font-size: 0.85rem;

            letter-spacing: 2px;

            cursor: pointer;

            transition: all 0.3s ease;

            z-index: 20;
        }


        .back-button:hover {

            color: var(--gold);

            border-color: var(--gold);

            box-shadow:
                0 0 15px rgba(214,184,106,0.1);
        }


        /* =========================================
           MEMBERS TITLE
        ========================================= */

        .page-header {

            margin-bottom: 55px;
        }


        .members-title {

            font-family: var(--font-title);

            font-size: clamp(
                2rem,
                4vw,
                3rem
            );

            font-weight: 500;

            letter-spacing: 7px;

            color: #f1f1f1;

            position: relative;

            display: inline-block;
        }


        .members-title::after {

            content: "";

            display: block;

            width: 60px;

            height: 1px;

            margin: 18px auto 0;

            background: var(--gold);

            box-shadow:
                0 0 10px rgba(214,184,106,0.5);
        }


        /* =========================================
           GROUP
        ========================================= */

        .founders-group {

            width: 100%;

            max-width: 700px;

            margin: auto;

            text-align: left;
        }


        .group-title {

            color: #666;

            font-size: 0.9rem;

            font-weight: 400;

            letter-spacing: 4px;

            margin-bottom: 15px;

            padding-bottom: 12px;

            border-bottom: 1px solid #1e1e1e;
        }


        /* =========================================
           MEMBER CARD
        ========================================= */

        .member-card {

            position: relative;

            background:
                linear-gradient(
                    135deg,
                    #111111,
                    #0b0b0b
                );

            border: 1px solid #242424;

            padding: 28px 30px;

            margin-bottom: 15px;

            overflow: hidden;

            transition:
                border-color 0.4s ease,
                transform 0.4s ease,
                box-shadow 0.4s ease;
        }


        /* Gold side line */

        .member-card::before {

            content: "";

            position: absolute;

            left: 0;

            top: 0;

            width: 2px;

            height: 100%;

            background:
                linear-gradient(
                    to bottom,
                    transparent,
                    var(--gold),
                    transparent
                );

            transform: scaleY(0);

            transform-origin: bottom;

            transition:
                transform 0.4s ease;
        }


        /* Light sweep */

        .member-card::after {

            content: "";

            position: absolute;

            top: 0;

            left: -120%;

            width: 80%;

            height: 100%;

            background: linear-gradient(
                90deg,
                transparent,
                rgba(255,255,255,0.035),
                transparent
            );

            transform: skewX(-20deg);

            transition: 0.7s;
        }


        .member-card:hover {

            border-color:
                rgba(214,184,106,0.45);

            transform:
                translateY(-3px);

            box-shadow:
                0 10px 30px rgba(0,0,0,0.5);
        }


        .member-card:hover::before {

            transform: scaleY(1);
        }


        .member-card:hover::after {

            left: 130%;
        }


        /* =========================================
           CARD CONTENT
        ========================================= */

        .card-content {

            display: flex;

            align-items: center;
        }


        .member-card .info {

            flex: 1;
        }


        /* =========================================
           OWNER RANK
        ========================================= */

        .member-card .rank {

            display: block;

            color: var(--gold-light);

            font-family: var(--font-title);

            font-size: 1.15rem;

            font-weight: 900;

            letter-spacing: 7px;

            margin-bottom: 8px;

            text-transform: uppercase;

            text-shadow:
                0 0 5px rgba(214,184,106,0.35),
                0 0 15px rgba(214,184,106,0.18);

            position: relative;
        }


        /* Gold line below OWNER */

        .member-card .rank::after {

            content: "";

            display: block;

            width: 42px;

            height: 1px;

            margin-top: 7px;

            background:
                linear-gradient(
                    to right,
                    var(--gold-dark),
                    var(--gold-light),
                    transparent
                );

            box-shadow:
                0 0 6px rgba(214,184,106,0.35);
        }


        /* =========================================
           MEMBER NAME
        ========================================= */

        .member-card .name {

            color: #eeeeee;

            font-family: var(--font-body);

            font-size: 1.4rem;

            font-weight: 600;

            letter-spacing: 2px;

            text-shadow:
                0 2px 8px rgba(0,0,0,0.8);
        }


        /* =========================================
           SCROLLBAR
        ========================================= */

        #members-page::-webkit-scrollbar {

            width: 5px;
        }


        #members-page::-webkit-scrollbar-track {

            background: #050505;
        }


        #members-page::-webkit-scrollbar-thumb {

            background: #292929;
        }


        #members-page::-webkit-scrollbar-thumb:hover {

            background: var(--gold);
        }


        /* =========================================
           MOBILE
        ========================================= */

        @media (max-width: 768px) {

            .main-title {

                font-size: 2.2rem;

                letter-spacing: 8px;

                margin-left: 8px;
            }


            .luxury-line {

                font-size: 0.6rem;

                letter-spacing: 3px;
            }


            .premium-button {

                padding: 14px 40px;

                font-size: 0.9rem;
            }


            #members-page {

                padding-top: 90px;
            }


            .members-title {

                font-size: 1.8rem;

                letter-spacing: 4px;
            }


            .founders-group {

                width: 100%;
            }


            .member-card {

                padding: 24px 22px;
            }


            .member-card .rank {

                font-size: 1rem;

                letter-spacing: 5px;
            }


            .member-card .name {

                font-size: 1.15rem;
            }


            .back-button {

                top: 15px;

                left: 15px;

                padding: 8px 15px;
            }
        }


        @media (max-width: 480px) {

            .main-title {

                font-size: 1.8rem;

                letter-spacing: 6px;
            }


            .premium-button {

                margin-top: 45px;
            }
        }

    </style>
</head>


<body>


    <!-- =========================================
         LANDING PAGE
    ========================================= -->

    <div id="landing-page" class="section active">

        <div class="content-wrapper">

            <div class="landing-content">

                <!-- Decorative Line -->
                <div class="top-line"></div>


                <!-- VERQDUS -->
                <h1 class="main-title">
                    VERQDUS
                </h1>


                <!-- Official -->
                <div class="luxury-line">
                    OFFICIAL
                </div>


                <!-- Members Button -->
                <button
                    id="goto-members"
                    class="premium-button"
                >
                    <span>MEMBERS</span>
                </button>

            </div>

        </div>

    </div>



    <!-- =========================================
         MEMBERS PAGE
    ========================================= -->

    <div id="members-page" class="section">


        <!-- Back Button -->

        <button
            id="back-button"
            class="back-button"
        >
            ← BACK
        </button>


        <div class="content-wrapper">


            <!-- Header -->

            <div class="page-header">

                <h2 class="members-title">
                    MEMBERS LIST
                </h2>

            </div>



            <!-- OWNER / FOUNDERS -->

            <div class="founders-group">

                <h3 class="group-title">
                    OWNER & FOUNDERS
                </h3>


                <!-- MEMBER -->

                <div class="member-card">

                    <div class="card-content">

                        <div class="info">

                            <span class="rank">
                                OWNER
                            </span>


                            <h4 class="name">
                                Draqen Verqdus
                            </h4>

                        </div>

                    </div>

                </div>

            </div>

        </div>

    </div>



    <!-- =========================================
         JAVASCRIPT
    ========================================= -->

    <script>

        const landingPage =
            document.getElementById("landing-page");

        const membersPage =
            document.getElementById("members-page");

        const gotoMembersBtn =
            document.getElementById("goto-members");

        const backButton =
            document.getElementById("back-button");


        /* =========================================
           GO TO MEMBERS
        ========================================= */

        gotoMembersBtn.addEventListener(
            "click",
            () => {

                landingPage.classList.remove("active");

                setTimeout(() => {

                    membersPage.classList.add("active");

                }, 250);

            }
        );


        /* =========================================
           BACK TO HOME
        ========================================= */

        backButton.addEventListener(
            "click",
            () => {

                membersPage.classList.remove("active");

                setTimeout(() => {

                    landingPage.classList.add("active");

                }, 250);

            }
        );

    </script>

</body>
</html>
